# VibeKey 官网。共享代理(/opt/proxy)通过 "web" 网络以 vibekey-web:8080 访问这个容器。
name: vibekey-web

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: vibekey-web
    restart: unless-stopped
    networks:
      web:
        aliases: [vibekey-web]

networks:
  web:
    external: true
